<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shufi Setup</title>
<script>
/* Theme and language are read before first paint so the page never flashes the wrong one.
   Both fall back quietly when storage is blocked. The two typefaces (Fraunces for display,
   Figtree for text; SIL Open Font License 1.1) are served by this server, and the token has
   to ride on the url, so their @font-face is written here. */
(function () {
  var d = document.documentElement, t = 'dark', l = '';
  try { var s = localStorage.getItem('shufi-setup-theme'); if (s === 'light' || s === 'dark') t = s; else if (matchMedia('(prefers-color-scheme: light)').matches) t = 'light'; } catch (e) {}
  try { var q = new URLSearchParams(location.search).get('lang'); if (q === 'he' || q === 'en') l = q; else l = localStorage.getItem('shufi-setup-lang') || ''; } catch (e) {}
  if (l !== 'he' && l !== 'en') l = /^he\b/i.test(navigator.language || '') ? 'he' : 'en';
  d.dataset.theme = t; d.lang = l; d.dir = l === 'he' ? 'rtl' : 'ltr';
  var tok = ''; try { tok = encodeURIComponent(new URLSearchParams(location.search).get('t') || ''); } catch (e) {}
  var f = function (name, file, w) { return '@font-face{font-family:"' + name + '";font-style:normal;font-weight:' + w + ';font-display:swap;src:url(/assets/fonts/' + file + '.woff2?t=' + tok + ') format("woff2-variations"),url(/assets/fonts/' + file + '.woff2?t=' + tok + ') format("woff2")}'; };
  var st = document.createElement('style'); st.textContent = f('Fraunces', 'fraunces-latin-full', '100 900') + f('Figtree', 'figtree-latin', '300 900');
  document.head.appendChild(st);
})();
</script>
<style>
/* ---------------------------------------------------------------------------
   Shufi setup. One calm screen: Shufi (the felt owl) in an arched window talks
   you through each step; the tree, the nest and your computer sit beside. The
   page loads nothing from outside this server (see the CSP in server.mjs).
   Layout uses logical properties, so Hebrew (right to left) flips the columns
   and the page chrome; the tree scene is drawn left to right and is not mirrored.
   --------------------------------------------------------------------------- */
/* ===== Shufi R4 base: tokens, felt, top bar, side column, catalog, detail, chat ===== */
:root{
  --display:"Fraunces","Iowan Old Style","Palatino Linotype",Georgia,serif;
  --body:"Figtree","Segoe UI",system-ui,-apple-system,sans-serif;
  --orange:#e5813f; --orange-ink:#1f0e04; --navy:#111f35; --hood:#bb6332; --esp:#321a13;
  --grain-l:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n' x='0' y='0' width='100%' height='100%'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' seed='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .98  0 0 0 0 .88  0 0 0 0 .74  0 0 0 1.3 -.42'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  --grain-d:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='m' x='0' y='0' width='100%' height='100%'><feTurbulence type='fractalNoise' baseFrequency='.045 .6' numOctaves='2' seed='9' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .08  0 0 0 0 .04  0 0 0 0 .02  0 0 0 1.5 -.5'/></filter><rect width='100%' height='100%' filter='url(%23m)'/></svg>");
  --stitch-mask:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='100%' height='100%'><rect width='100%' height='100%' rx='14' fill='none' stroke='black' stroke-width='5' stroke-dasharray='8 6' stroke-linecap='round'/></svg>");
}
/* Felt Night (dark) */
:root,:root[data-theme="dark"]{
  --bg:#0f1d34; --surface:#1d2c46; --surface-2:#172846; --ink:#f2e6d8; --muted:#c9b8a4; --line:#c9b8a4;
  --amber:#f3b048; --amber-ink:#f3b048; --accent-glow:rgba(229,129,63,.28); --ok:#f3b048;
  --paper:#efe2cc; --paper-ink:#2a1710; --grain-op:.5; --shadow:rgba(0,0,0,.6);
  --stitch:rgba(242,230,216,.5); --row-hover:rgba(243,176,72,.09); --field:#12223c;
}
/* Felt Day (light) */
:root[data-theme="light"]{
  --bg:#f4ece0; --surface:#fbf6ee; --surface-2:#f8f0e4; --ink:#321a13; --muted:#6f6257; --line:#8a6a52;
  --amber:#c98a1e; --amber-ink:#8a5a0c; --accent-glow:rgba(229,129,63,.3); --ok:#8a5a0c;
  --paper:#fbf6ee; --paper-ink:#321a13; --grain-op:.32; --shadow:rgba(80,50,30,.28);
  --stitch:rgba(138,106,82,.55); --row-hover:rgba(201,138,30,.12); --field:#fffaf2;
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
html{background:var(--bg);color-scheme:light dark}
:root[data-theme="light"]{color-scheme:light}
:root[data-theme="dark"]{color-scheme:dark}
body{position:relative;font-family:var(--body);color:var(--ink);overflow:hidden;-webkit-font-smoothing:antialiased;line-height:1.4;font-size:1rem}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:inherit;padding:0}
input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--orange);outline-offset:2px;border-radius:.5rem}
ol,ul{list-style:none;padding:0}
a{color:inherit}
kbd{font:500 .72rem var(--body);border:1px solid var(--stitch);border-bottom-width:2px;border-radius:.3rem;padding:.05rem .32rem;color:var(--muted);background:transparent}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
[hidden]{display:none!important}

/* felt + stitch */
.felt{position:relative;background-color:var(--f,var(--surface));color:var(--t,var(--ink));border-radius:.9rem}
.felt::before{content:"";position:absolute;inset:0;border-radius:inherit;background-image:var(--grain-l),var(--grain-d);opacity:var(--grain-op);pointer-events:none;mix-blend-mode:soft-light}
.stitched::after{content:"";position:absolute;inset:.3rem;border-radius:.65rem;background:var(--st,var(--stitch));opacity:.7;pointer-events:none;-webkit-mask:var(--stitch-mask) 0 0/100% 100% no-repeat;mask:var(--stitch-mask) 0 0/100% 100% no-repeat}
.felt>*{position:relative;z-index:1}

/* buttons: one orange primary, everything else quiet */
.btn{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:.5rem;min-height:2.5rem;padding:.4rem 1.1rem;border-radius:.8rem;font-weight:600;font-size:.95rem;text-align:center;white-space:nowrap;transition:transform .18s,box-shadow .18s,background .2s}
.btn.pri{background:var(--orange);color:var(--orange-ink);font-size:1.02rem;min-height:2.9rem;padding:.5rem 1.4rem;box-shadow:0 .5rem .8rem -.45rem var(--shadow),inset 0 0 0 1px rgba(31,14,4,.12)}
.btn.pri::before{content:"";position:absolute;inset:.22rem;border-radius:.6rem;border:1.5px dashed rgba(31,14,4,.5);pointer-events:none}
.btn.pri:hover{transform:translateY(-1px)}
.btn.sec{border:1.5px solid var(--line);color:var(--ink)}
.btn.sec:hover{background:var(--row-hover)}
.btn.ghost{color:var(--muted);border:1.5px dashed transparent}
.btn.ghost:hover{color:var(--ink);border-color:var(--stitch)}
.lnk{color:var(--muted);text-decoration:underline;text-decoration-style:dotted;text-underline-offset:.25rem;font-size:.9rem;min-height:2.3rem;padding:.2rem .1rem}
.lnk:hover{color:var(--ink)}
.ibtn{min-height:2.3rem;min-width:5.2rem;padding:.2rem .8rem;border-radius:.6rem;border:1.5px solid var(--line);font-weight:600;font-size:.84rem;color:var(--ink);text-align:center;white-space:nowrap;background:transparent;transition:background .2s}
.ibtn:hover:not([disabled]){background:var(--row-hover);border-color:var(--ink)}
.ibtn[disabled]{cursor:default}
[data-state="installing"] .ibtn,.ibtn.is-installing{color:var(--muted);border-style:dashed}
[data-state="installed"] .ibtn,.ibtn.is-installed{border-color:transparent;color:var(--ok)}
[data-state="signin"] .ibtn,.ibtn.is-signin{border-color:var(--amber);color:var(--amber-ink)}
.ibtn.is-installed::before{content:"";display:inline-block;width:.8rem;height:.8rem;margin-right:.35rem;vertical-align:-.1rem;background:currentColor;-webkit-mask:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path d='M5 12.5l4.5 4.5L19 7.5' fill='none' stroke='black' stroke-width='3.2' stroke-linecap='round' stroke-linejoin='round'/></svg>") center/contain no-repeat;mask:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path d='M5 12.5l4.5 4.5L19 7.5' fill='none' stroke='black' stroke-width='3.2' stroke-linecap='round' stroke-linejoin='round'/></svg>") center/contain no-repeat}

/* ---------- top bar ---------- */
#top{position:relative;z-index:20;display:flex;align-items:center;gap:1.2rem;height:3.7rem;padding:0 1.4rem}
.mark{font-family:var(--display);font-variation-settings:"SOFT" 100,"opsz" 72;font-weight:600;font-size:1.75rem;display:flex;align-items:center;gap:.7rem;white-space:nowrap;min-width:9.5rem}
.mark i{font-style:normal;font-family:var(--body);font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;font-weight:600;color:var(--muted);border:1.5px dashed var(--stitch);border-radius:999px;padding:.12rem .6rem}
#prog{position:relative;flex:1;max-width:48rem;margin:0 auto;display:flex;height:100%}
#prog .seam{position:absolute;left:8.33%;right:8.33%;top:1.02rem;height:2px;border-radius:2px;background:repeating-linear-gradient(90deg,var(--stitch) 0 6px,transparent 6px 11px);pointer-events:none}
#prog .seam i{position:absolute;left:0;top:0;bottom:0;width:0;background:repeating-linear-gradient(90deg,var(--amber) 0 6px,transparent 6px 11px);transition:width .8s ease}
.knot{position:relative;flex:1;display:flex;flex-direction:column;align-items:center;gap:.25rem;padding-top:.62rem;font-size:.74rem;color:var(--muted);text-align:center;line-height:1.1;min-width:0}
.knot b{width:.85rem;height:.85rem;border-radius:50%;border:2px dashed var(--line);background:var(--bg);transition:.35s;flex:none}
.knot span{max-width:7.4rem;text-wrap:balance}
.knot:hover span{color:var(--ink);text-decoration:underline;text-underline-offset:.2rem}
.knot:hover b{border-color:var(--orange)}
.knot.done b{border-style:solid;border-color:var(--amber);background:var(--amber)}
.knot.warn b{border-style:solid;border-color:var(--amber)}
.knot.cur b{border-style:solid;border-color:var(--orange);background:var(--bg);box-shadow:0 0 0 .22rem var(--accent-glow)}
.knot.cur,.knot.done{color:var(--ink)}
.knot.cur span{font-weight:600}
#top .tools{display:flex;align-items:center;gap:.6rem;min-width:9.5rem;justify-content:flex-end}
#catalog-open{display:inline-flex;align-items:center;gap:.55rem;min-height:2.5rem;padding:0 .9rem;border-radius:.7rem;border:1.5px solid var(--line);font-weight:600;font-size:.9rem}
#catalog-open:hover{background:var(--row-hover)}
#catalog-open svg,.srch svg{width:1rem;height:1rem;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round}
#theme-toggle{width:2.5rem;height:2.5rem;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center}
#theme-toggle:hover{background:var(--row-hover)}
#theme-toggle svg{width:1.15rem;height:1.15rem;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
:root[data-theme="light"] #theme-toggle .i-sun{display:none}
:root[data-theme="dark"] #theme-toggle .i-moon{display:none}

/* ---------- Shufi: the side column ---------- */
#shufi{position:relative;display:flex;flex-direction:column;gap:.85rem;min-height:0}
.sh-stage{display:grid;place-items:center;flex:none}
.sh-win{position:relative;width:12.6rem;height:12.8rem;--f:#604435;padding:.55rem;border-radius:6.3rem 6.3rem .9rem .9rem;box-shadow:0 1rem 1.4rem -.8rem var(--shadow),inset 0 2px 0 rgba(255,235,205,.18);cursor:pointer}
.sh-win::after{content:"";position:absolute;inset:.22rem;border-radius:6.1rem 6.1rem .7rem .7rem;border:2px dashed rgba(242,230,216,.5);pointer-events:none;z-index:3}
.sh-win .glass{position:absolute;inset:.6rem;border-radius:5.8rem 5.8rem .4rem .4rem;overflow:hidden;background:#111f35;box-shadow:inset 0 0 1.4rem rgba(0,0,0,.55)}
.sh-win .glass::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,rgba(255,255,255,.12) 0,rgba(255,255,255,0) 28%);pointer-events:none}
#shufiImgs{position:absolute;inset:0}
#shufiImgs img{position:absolute;left:-6%;top:-2%;width:112%;height:112%;object-fit:cover;opacity:0;transition:opacity .3s;animation:breathe 6s ease-in-out infinite;transform-origin:50% 90%}
#shufiImgs img.on{opacity:1}
.sh-win.pop .glass{animation:pop .5s}
.sh-win .sill{position:absolute;left:-.5rem;right:-.5rem;bottom:-.4rem;height:.6rem;border-radius:.3rem;background:#87634c;box-shadow:0 .3rem .4rem -.15rem var(--shadow);z-index:2}
@keyframes breathe{0%,100%{scale:1}50%{scale:1.014}}
@keyframes pop{0%{scale:1}35%{scale:1.035;rotate:-1.5deg}100%{scale:1}}
#shufi-line{font-family:var(--display);font-variation-settings:"SOFT" 100,"opsz" 40;font-weight:500;font-size:1.32rem;line-height:1.22;min-height:3.3rem;text-wrap:pretty}
#more-text{font-size:.93rem;line-height:1.45;color:var(--muted);border-left:2px dashed var(--stitch);padding:.1rem 0 .1rem .8rem}
.sh-actions{display:flex;flex-direction:column;gap:.5rem;align-items:stretch}
.sh-actions .btn.ghost{min-height:2.4rem;font-weight:500;font-size:.9rem}
.sh-links{display:flex;gap:1.2rem;align-items:center}
#shufi-sec .kk{margin-left:.4rem}

/* ---------- catalog ---------- */
.cat-head{display:flex;flex-direction:column;gap:.55rem}
.srch{display:flex;align-items:center;gap:.55rem;min-height:2.6rem;padding:0 .75rem;border:1.5px solid var(--line);border-radius:.75rem;background:var(--field);color:var(--muted)}
.srch:focus-within{border-color:var(--orange);box-shadow:0 0 0 .2rem var(--accent-glow)}
#catalog-search{flex:1;min-width:0;border:0;outline:0;background:transparent;color:var(--ink);font-size:.95rem;min-height:2.3rem}
#catalog-search::placeholder{color:var(--muted)}
#catalog-search::-webkit-search-cancel-button{display:none}
.seg{display:flex;border:1.5px solid var(--line);border-radius:.7rem;overflow:hidden}
.seg button{flex:1;min-height:2.3rem;text-align:center;font-weight:600;font-size:.84rem;color:var(--muted)}
.seg button+button{border-left:1.5px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.chips{display:flex;flex-wrap:wrap;gap:.35rem}
.chips button{min-height:2.3rem;padding:.1rem .65rem;border:1.5px dashed var(--line);border-radius:999px;font-size:.8rem;color:var(--muted)}
.chips button:hover{color:var(--ink)}
.chips button[aria-pressed="true"]{border-style:solid;border-color:var(--ink);color:var(--ink);font-weight:600}
.cat-list{overflow:auto;min-height:0;flex:1;padding-right:.2rem;scrollbar-width:thin;scrollbar-color:var(--line) transparent}
.sec-h{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:.6rem;padding:.55rem .1rem .35rem;background:var(--bg);border-bottom:1.5px dashed var(--stitch)}
.cat-panel .sec-h{background:var(--surface)}
.sec-h b{font-family:var(--display);font-variation-settings:"SOFT" 100,"opsz" 36;font-weight:600;font-size:1.02rem}
.sec-h small{color:var(--muted);font-size:.74rem;flex:1;white-space:nowrap}
.row{display:flex;align-items:center;gap:.4rem;min-height:3.4rem;padding:.2rem .1rem .2rem .2rem;border-radius:.6rem}
.row.sel,.row:hover{background:var(--row-hover)}
.row-main{flex:1;min-width:0;display:flex;align-items:center;gap:.65rem;min-height:3rem;text-align:left;border-radius:.6rem}
.ico{flex:none;width:2.1rem;height:2.1rem;border-radius:50%;display:grid;place-items:center;background:var(--paper);color:var(--paper-ink);font:600 .72rem var(--display);box-shadow:inset 0 0 0 1.5px var(--stitch)}
.ico svg{width:1.05rem;height:1.05rem;fill:currentColor}
.ico.sk{border-radius:.9rem .2rem .9rem .2rem}
.rt{min-width:0;display:flex;flex-direction:column}
.rt b{font-weight:600;font-size:.93rem;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rt small{font-size:.76rem;color:var(--muted);line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rt .kit{color:var(--amber-ink);font-weight:600}
.rs{font-size:.7rem;color:var(--amber-ink);font-weight:600;white-space:nowrap}
.row[data-state="idle"] .rs,.row[data-state="installed"] .rs{display:none}
.none{padding:1.2rem .4rem;color:var(--muted);font-size:.92rem}

/* ---------- detail ---------- */
#detail{z-index:40;display:flex;flex-direction:column;gap:.7rem;padding:1.1rem 1.2rem 1.1rem;overflow:auto;box-shadow:0 1.6rem 2.4rem -1rem var(--shadow);--f:var(--surface);border:1.5px solid var(--stitch);border-radius:1rem}
#detail .dh{display:flex;gap:.7rem;align-items:center}
#detail .dh .ico{width:2.8rem;height:2.8rem;font-size:.9rem}
#detail .dh .ico svg{width:1.4rem;height:1.4rem}
#detail h2{font-family:var(--display);font-variation-settings:"SOFT" 100,"opsz" 48;font-weight:600;font-size:1.4rem;line-height:1.1}
#detail .kind{font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--amber-ink)}
#detail-close{margin-left:auto;width:2.5rem;height:2.5rem;border-radius:50%;display:grid;place-items:center;font-size:1.4rem;color:var(--muted);flex:none}
#detail-close:hover{background:var(--row-hover);color:var(--ink)}
#detail .what{font-size:.98rem;line-height:1.42}
#detail .more{font-size:.88rem;color:var(--muted);line-height:1.42}
#detail dl{display:grid;grid-template-columns:1fr 1fr;gap:.65rem .9rem}
#detail dt{font-size:.66rem;letter-spacing:.13em;text-transform:uppercase;font-weight:700;color:var(--amber-ink);margin-bottom:.1rem}
#detail dd{font-size:.88rem;line-height:1.3}
#detail dd.sg{font-weight:700;color:var(--amber-ink)}
#detail dl .wide{grid-column:1/-1}
#detail .da{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center;margin-top:.2rem}
#detail .da a.btn{min-height:2.4rem;font-size:.88rem}
#detail .da .ibtn{min-height:2.5rem;padding:.3rem 1.2rem;font-size:.95rem}

/* ---------- misc ---------- */
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}



/* ================= Day Tree: tokens for the drawing ================= */
:root,:root[data-theme="dark"]{
  --sky-a:#0f1d34; --sky-b:#16294a; --wood:#5d4130; --wood-hi:#8d6549; --canopy:#27423b; --canopy-2:#1f352f; --canopy-3:#31504a; --leafy:#5b8f6f; --leafy-2:#47775c; --leaf-edge:#2a4a3d;
  --ground:#2c1b13; --ground-2:#3b261b; --sun:#e8d3ac; --moon-cut:#13223d; --stars:.85;
  --leaf:#3e6157; --leaf-line:rgba(201,184,164,.5); --petal:#f6e3c4; --petal-line:#d9a35a; --bloom:#f3b048;
  --fruit-a:#f3b048; --fruit-b:#e5813f; --fruit-ink:#1f0e04; --fruit-idle:rgba(242,230,216,.07); --fruit-line:rgba(242,230,216,.55); --glow:rgba(243,176,72,.7);
  --card:#1d2c46; --card-ink:#f2e6d8; --thread:#c9b8a4; --label:#f2e6d8; --label-dim:#c9b8a4;
}
:root[data-theme="light"]{
  --sky-a:#f7f0e4; --sky-b:#efe3cf; --wood:#8a6244; --wood-hi:#b58a62; --canopy:#aabf8b; --canopy-2:#93ab76; --canopy-3:#c3d3a6; --leafy:#8fb06c; --leafy-2:#7a9c5a; --leaf-edge:#5f7d45;
  --ground:#9db07f; --ground-2:#b3c496; --sun:#f3b048; --moon-cut:transparent; --stars:0;
  --leaf:#c9d8ae; --leaf-line:rgba(70,90,50,.55); --petal:#fbe9e2; --petal-line:#d98a72; --bloom:#c98a1e;
  --fruit-a:#f6a766; --fruit-b:#e5813f; --fruit-ink:#1f0e04; --fruit-idle:rgba(255,255,255,.4); --fruit-line:#8a6a52; --glow:rgba(229,129,63,.35);
  --card:#fbf6ee; --card-ink:#321a13; --thread:#8a6a52; --label:#321a13; --label-dim:#6f6257;
}
html{background:var(--sky-a)}
#sky{position:fixed;inset:0;z-index:0;background:radial-gradient(55% 40% at 80% 4%,rgba(243,176,72,.16),transparent 70%),linear-gradient(var(--sky-a),var(--sky-b));transition:background .6s}
:root[data-theme="light"] #sky{background:radial-gradient(55% 45% at 82% 2%,rgba(243,176,72,.3),transparent 72%),radial-gradient(70% 50% at 20% 100%,rgba(157,176,127,.28),transparent 70%),linear-gradient(var(--sky-a),var(--sky-b))}
:root[data-theme="dark"] #sky{background:radial-gradient(60% 50% at 24% 90%,rgba(243,176,72,.1),transparent 70%),radial-gradient(90% 70% at 50% 0%,rgba(46,78,130,.45),transparent 70%),linear-gradient(var(--sky-a),var(--sky-b))}
#sky::after{content:"";position:absolute;inset:0;background-image:var(--grain-l),var(--grain-d);opacity:var(--grain-op);mix-blend-mode:soft-light;pointer-events:none}

/* Fonts: Fraunces (display) and Figtree (body) are served by this server and declared at
   the top of the page (the token has to ride on the url). Neither covers Hebrew, so Hebrew
   falls back to named system faces, then the system UI font. */
:root{
  --display:"Fraunces","Iowan Old Style","Palatino Linotype",Georgia,"Arial Hebrew","Noto Sans Hebrew","Noto Serif Hebrew","Times New Roman",serif;
  --body:"Figtree","Segoe UI","Arial Hebrew","Noto Sans Hebrew",system-ui,-apple-system,sans-serif;

.btag.bun .coin{position:relative;display:block;left:auto;top:auto;margin:0 0 3px;width:24px;height:24px}

:focus-visible{outline-color:var(--orange)}

/* the prototype hid the page scroll; the real page scrolls inside the left column on desktop and as a page on a phone */

#shufi{flex:none;min-height:min-content}
#topic{flex:1 1 auto;min-height:0}
.iconbtn{display:grid;place-items:center;width:2.5rem;height:2.5rem;border-radius:50%;border:1.5px solid var(--line)}

.mark #brand{display:inline-block}

/* owl: a letter instead of a photo for another edition */
.sh-win .glass.letter #shufiImgs{display:grid;place-items:center;font:600 5.5rem var(--display);color:var(--orange)}

/* connection lost: the owl says so and everything else waits */
body.offline .sh-who i{background:#ff9b9b;box-shadow:0 0 0 .2rem rgba(255,155,155,.25)}
body.offline #treecol,body.offline #stepform,body.offline .sh-actions,body.offline #prog,body.offline #topic{opacity:.55;pointer-events:none}

/* step forms: the real controls, in the same felt */
#stepform{display:flex;flex-direction:column;gap:.7rem;padding:.9rem .95rem 1rem;--f:var(--surface);border-radius:1.1rem;border:1.5px solid var(--stitch);box-shadow:0 .9rem 1.3rem -.9rem var(--shadow);flex:none}
#stepform[hidden]{display:none}

.sl{font-size:.68rem;letter-spacing:.13em;text-transform:uppercase;font-weight:700;color:var(--amber-ink);margin-top:.2rem}

.dot{width:.65rem;height:.65rem;border-radius:50%;flex:none;background:var(--line)}
.dot.ok{background:#7fbf7a}.dot.warn{background:var(--amber)}.dot.bad{background:#ff9b9b}
.chip{font-size:.74rem;font-weight:600;padding:.1rem .55rem;border-radius:99px;border:1.5px dashed var(--line);color:var(--muted);white-space:nowrap}
.chip.ok{color:var(--ok);border-style:solid;border-color:transparent}
.chip.warn{color:var(--amber-ink);border-color:var(--amber)}
.chip.bad{color:#ff9b9b;border-color:#ff9b9b}
:root[data-theme="light"] .chip.bad{color:#a32020;border-color:#a32020}
.field{display:grid;gap:.3rem}
.field label,.field .fl{font-size:.8rem;font-weight:600;color:var(--muted)}
.field .note,.note{font-size:.78rem;line-height:1.35;color:var(--muted)}
.inline{display:flex;gap:.45rem;align-items:center}
.inline>input{flex:1}
.fcard input[type=text],.fcard input[type=password],#stepform input[type=text],#stepform input[type=password],#detail input[type=text],#detail input[type=password]{width:100%;min-width:0;min-height:2.5rem;padding:.3rem .8rem;border:1.5px solid var(--line);border-radius:.7rem;background:var(--field);color:var(--ink);font:500 .88rem var(--mono);direction:ltr;text-align:start}
#stepform input::placeholder,#detail input::placeholder{color:var(--muted);opacity:.85}
#stepform input:focus,#detail input:focus{outline:0;border-color:var(--orange);box-shadow:0 0 0 .2rem var(--accent-glow)}
#stepform input:focus-visible,#detail input:focus-visible{outline:3px solid var(--orange);outline-offset:2px}

.popt{--f:var(--card);--t:var(--card-ink);position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:.35rem;min-height:9.2rem;padding:.95rem .9rem .85rem;border-radius:.9rem;box-shadow:0 .7rem 1rem -.7rem var(--shadow);text-align:start;cursor:pointer;transition:transform .2s}

.popt .pi svg{width:1.35rem;height:1.35rem;fill:currentColor}
.popt .pn{font-family:var(--display);font-variation-settings:"SOFT" 100,"opsz" 36;font-weight:600;font-size:1.12rem;line-height:1.1}
.popt .pm{font-size:.8rem;line-height:1.3;color:var(--label-dim)}
.popt.soon .pi{background:var(--paper);color:var(--paper-ink);border-color:var(--stitch)}
.popt .chip{margin-top:auto;color:var(--card-ink);border-color:var(--line)}
.popt .pgo{margin-top:auto;font-size:.8rem;font-weight:700;color:var(--amber-ink);display:inline-flex;align-items:center;gap:.3rem}
.popt:focus-visible{outline:3px solid var(--ink);outline-offset:3px;border-radius:.9rem}
.psoon{display:flex;flex-direction:column;gap:.6rem;padding:.8rem .85rem;border:1.5px dashed var(--stitch);border-radius:.8rem}
.psoon h3{font-family:var(--display);font-variation-settings:"SOFT" 100,"opsz" 36;font-weight:600;font-size:1.02rem;line-height:1.2}
.psoon p{font-size:.86rem;line-height:1.4;color:var(--muted)}
.psoon .sbtn,.psoon .chip{align-self:flex-start}
.sbtn{min-height:2.4rem;padding:.2rem .9rem;border-radius:.65rem;border:1.5px solid var(--line);font-weight:600;font-size:.86rem;white-space:nowrap;text-align:center;display:inline-flex;align-items:center;justify-content:center;gap:.4rem;text-decoration:none;color:var(--ink)}
.sbtn:hover:not([disabled]){background:var(--row-hover);border-color:var(--ink)}
.sbtn[disabled]{opacity:.6;cursor:default}
.sbtn.pri{background:var(--orange);border-color:var(--orange);color:var(--orange-ink)}
.sbtn.pri:hover:not([disabled]){background:var(--orange);filter:brightness(1.06)}
.cmd{display:flex;align-items:center;gap:.4rem;padding:.35rem .4rem .35rem .7rem;border-radius:.6rem;border:1.5px dashed var(--stitch);background:var(--field);font:500 .76rem var(--mono);color:var(--muted);direction:ltr;text-align:left}
.cmd code{min-width:0;flex:1;overflow-x:auto;white-space:nowrap;scrollbar-width:thin}
.msg{font-size:.8rem;line-height:1.35;min-height:0}
.msg:empty{display:none}
.msg.bad{color:#ff9b9b}.msg.ok{color:var(--ok)}
:root[data-theme="light"] .msg.bad{color:#a32020}
.spin{display:inline-block}
.sw{position:relative;width:2.8rem;height:1.6rem;flex:none}
.sw input{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:pointer;z-index:2}
.sw span{position:absolute;inset:0;border-radius:99px;background:var(--line);opacity:.55;transition:background .15s,opacity .15s}
.sw span::after{content:"";position:absolute;inset-inline-start:.2rem;top:.2rem;width:1.2rem;height:1.2rem;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.35);transition:inset-inline-start .15s}
.sw input:checked+span{background:var(--orange);opacity:1}
.sw input:checked+span::after{inset-inline-start:1.4rem}
.sw input:disabled{cursor:default}.sw input:disabled+span{opacity:.35}
.sw input:focus-visible+span{outline:3px solid var(--orange);outline-offset:3px}
#stepform details{border:1.5px dashed var(--stitch);border-radius:.7rem;padding:.5rem .8rem}
#stepform summary{cursor:pointer;font-size:.84rem;color:var(--muted)}
.tcard{display:flex;flex-direction:column;gap:.5rem;padding:.7rem .75rem;border:1.5px dashed var(--stitch);border-radius:.8rem}
.tcard[data-state="ready"]{border-style:solid;border-color:color-mix(in srgb,var(--amber) 55%,transparent)}
.tcard header{display:flex;align-items:center;justify-content:space-between;gap:.5rem}
.tcard .fn{font-weight:600;font-size:.93rem}
.tcard .why{font-size:.8rem;line-height:1.35;color:var(--muted)}
.tcard .acts{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center}
.tcard .acts a{font-size:.8rem}
.dlist{display:grid;gap:.9rem;padding:0;margin:0;list-style:none}
.dlist li{display:flex;gap:.7rem;align-items:flex-start;font-size:.9rem;line-height:1.4}
.dlist .k{flex:none;width:1.6rem;height:1.6rem;border-radius:50%;display:grid;place-items:center;border:1.5px dashed var(--stitch);font-weight:600;font-size:.8rem}
.stlink{color:var(--amber-ink);font-weight:600}

/* topic panel extras */
#tp-status{font-size:.8rem;line-height:1.35;color:var(--muted);min-height:0}
#tp-status:empty{display:none}
#tp-status ul{margin:.25rem 0 0;padding-inline-start:1.1rem;list-style:disc}
.tp-list>li.row .rerr,.cat-list li.row .rerr{flex:0 0 100%}
.rerr{grid-column:1/-1;font-size:.78rem;color:#ff9b9b;padding:0 .2rem .3rem 3rem}
:root[data-theme="light"] .rerr{color:#a32020}
.rerr:empty{display:none}
.tp-list>li.row{flex-wrap:wrap}
#topic .tp-list li.row .row-main{flex:1 1 0}
.ibtn.is-idle{border-color:var(--line)}
.ibtn.is-installing{display:inline-flex;gap:.4rem;align-items:center;justify-content:center}
.rt b{overflow:hidden;text-overflow:ellipsis}
.rt small{display:flex;gap:.3em;align-items:baseline}
.rt small .kit,.rt small .sep{flex:none}
.rt small .dsc{flex:1 1 0;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#installlog{padding:0 .5rem;font-size:.85rem;line-height:1.4;color:var(--muted);text-align:center}
#installlog:empty,#installlog-d:empty{display:none}
#installlog-d{font-size:.85rem;line-height:1.4;color:var(--muted);padding:.1rem .2rem}
#installlog-d ul,#installlog-d div{margin:0}
#installlog-d ul{padding-inline-start:1.1rem;list-style:disc}
#installlog{display:none}
@media (max-width:700px){#installlog{display:block}#installlog:empty{display:none}#installlog-d{display:none}}
#installlog ul{margin:.2rem auto 0;padding:0;list-style:none}
#treebar .tb-btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem}
#treebar .tb-btn[disabled]{cursor:default}

/* scene cards on the ground */
#sign .rows .crow .nm{overflow:hidden;text-overflow:ellipsis}
#files .fp{white-space:nowrap}
#nestG .egg{transition:transform .6s cubic-bezier(.2,.9,.3,1.4),opacity .4s}
#readytag{left:24px;top:134px}
#phone .ph{left:11px}
#scene,#items,#back{direction:ltr}
#items .card,#items #files{text-align:start}
.card[dir=rtl]{text-align:right}

/* detail extras */
#detail .da{align-items:center}
#detail .sg{color:var(--amber-ink)}
#detail .field{margin-top:.1rem}
#detail dd{overflow-wrap:anywhere}
#detail .acts2{display:flex;flex-wrap:wrap;gap:.5rem}
#detail .cmd{margin-top:.1rem}

/* catalog (advanced) extras */
#catalog .none{padding:1.2rem .4rem}
.cat-list .row .rt small{max-width:100%}

/* RTL: the page chrome and columns flip, the tree scene does not */
:root[dir="rtl"] .sh-who{margin:-.1rem .2rem -.35rem 0}
:root[dir="rtl"] #shufi-line::before{left:auto;right:1.6rem}
:root[dir="rtl"] .you-lbl{margin:.2rem 0 -.35rem .3rem}
:root[dir="rtl"] #shufi .sh-actions .btn.pri{border-radius:1.1rem 1.1rem 1.1rem .35rem}
:root[dir="rtl"] #shufi .sh-actions .btn.pri::before{border-radius:.9rem .9rem .9rem .25rem}
:root[dir="rtl"] #shufi .sh-stage{padding-left:0;padding-right:.3rem}
:root[dir="rtl"] #more-text{border-left:0;border-right:2px dashed var(--stitch);padding:.1rem .8rem .1rem 0}
:root[dir="rtl"] .row-main{text-align:right}
:root[dir="rtl"] .seg button+button{border-left:0;border-right:1.5px solid var(--line)}
:root[dir="rtl"] #shufi-sec .kk{margin-left:0;margin-right:.4rem}
:root[dir="rtl"] .ibtn.is-installed::before{margin-right:0;margin-left:.35rem}
:root[dir="rtl"] #perm{padding:.75rem 2.4rem .75rem .9rem}
:root[dir="rtl"] #perm li::before{left:auto;right:-1.55rem}
:root[dir="rtl"] #prog .seam i{left:auto;right:0}
:root[dir="rtl"] #rightcol{right:auto;left:1.4rem;transform:translateX(calc(-100% - 2rem))}
:root[dir="rtl"] #rightcol.open{transform:none}
:root[dir="rtl"] #detail{right:auto;left:calc(1.4rem + 23rem + .8rem);animation-name:slideR}
:root[dir="rtl"] #topic .tp-list{padding:0 0 0 .2rem}
:root[dir="rtl"] .btag{direction:rtl}
:root[dir="rtl"] .rerr{padding:0 3rem .3rem .2rem}
:root[dir="rtl"] .cat-list{padding-right:0;padding-left:.2rem}
:root[dir="rtl"] #leftcol{padding-inline-end:.2rem}
:root[dir="rtl"] #stepform .lead,:root[dir="rtl"] #stepform .note{text-align:start}
@keyframes slideR{from{opacity:0;transform:translateX(-12px)}}
@keyframes pop2{0%{opacity:0;transform:translateY(4px)}100%{opacity:1}}

@media (max-width:700px){
  #topics-m.off{display:none}
  html,body{height:auto}
  body{overflow-x:hidden;overflow-y:auto}
  #app{display:block;height:auto}
  #leftcol{overflow:visible;padding:0}
  #detail{left:1rem;right:1rem;width:auto;top:3.6rem;max-height:calc(100vh - 4.6rem)}
  :root[dir="rtl"] #detail{left:1rem;right:1rem}
  #rightcol{left:1rem;right:1rem;width:auto;top:3.6rem;bottom:1rem;transform:translateY(calc(100% + 2rem))}
  #rightcol.open{transform:none}
  :root[dir="rtl"] #rightcol{left:1rem;right:1rem;transform:translateY(calc(100% + 2rem))}
  :root[dir="rtl"] #rightcol.open{transform:none}
  #shufi .sh-win{width:min(15rem,62vw);height:min(15.2rem,63vw)}

  #topic .tp-list{overflow:visible}
  #installlog{text-align:start;padding:0}
  .knot span{max-width:5.6rem}

  .bg .draw{stroke-dashoffset:0}
  #canopy{opacity:1;transform:none}
  .star,.tuft,.sprig,#shufiImgs img{animation:none!important}
}

  const first = fresh ? ids[0] : (ids.find((id) => id !== 'finish' && !STEP_DEFS[id].optional && stepStatus(id).s !== 'ok') || 'finish');
  state.scanned = !fresh || ids[0] !== 'machine' || state.preflight.length === 0;   // a first visit starts un-looked-at
  go(first);
  requestAnimationFrame(() => requestAnimationFrame(() => { window.__shufiReady = true; }));
})();

</script>
